<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffe9c2">
<title>節奏傳聲筒</title>
<style>
:root{
  --ink:#3d2f28;--muted:#9a8778;--card:#fffdf8;--line:#e9dccb;
  --accent:#ff8a3d;--accent-d:#e06a1d;--blue:#3fa9f5;--blue-d:#1f86d1;
  --perfect:#2fc46f;--good:#f5b400;--miss:#ff5468;--purple:#8a6cf0;
  --z1a:#fff4d6;--z1b:#ffd99a;--z2a:#e3f8dc;--z2b:#a8e39a;--z3a:#dcf4f1;--z3b:#94d9cf;--z4a:#dceeff;--z4b:#94c8f5;--z5a:#2b2f5e;--z5b:#151838;
  --bga:var(--z1a);--bgb:var(--z1b);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(170deg,var(--bga),var(--bgb));touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--ink)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#updBar{flex:0 0 auto;height:0;overflow:hidden;background:#2fae63;color:#fff;font-size:15px;font-weight:800;line-height:32px;text-align:center;cursor:pointer;transition:height .2s;white-space:nowrap}
#updBar.on{height:32px}
#bcast{flex:0 0 auto;height:0;overflow:hidden;background:#5b3fd0;color:#fff;font-size:14px;line-height:26px;white-space:nowrap;transition:height .2s}
#bcast.on{height:26px}
#bcast span{display:inline-block;padding-left:100%;animation:marq 14s linear infinite}
@keyframes marq{to{transform:translateX(-100%)}}
#screens{flex:1;position:relative;min-height:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:8px 10px;gap:8px;min-height:0}
.screen.active{display:flex}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:40px}
.topbar .grow{flex:1;min-width:0}
.ttl{font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12);display:grid;place-items:center;flex:0 0 auto}
.iconbtn svg{width:22px;height:22px}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:16px;font-weight:800;font-size:18px;
  background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-d);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.white{background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.14)}
.btn.small{min-height:36px;font-size:15px;padding:0 12px;border-radius:12px}
.btn:disabled{opacity:.45}
.btn svg{width:20px;height:20px;flex:0 0 auto}
.dotRed{position:relative}
.dotRed::after{content:"";position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:var(--miss);border:2px solid #fff}
.pill{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:4px 10px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.1);white-space:nowrap}
.pill svg{width:20px;height:20px}
.badge-test{background:#ff5468;color:#fff;font-size:12px;border-radius:8px;padding:2px 6px;font-weight:700}
.card{background:var(--card);border-radius:20px;box-shadow:0 4px 0 rgba(0,0,0,.08)}

/* 登入 */
#scrLogin{align-items:center;justify-content:center}
.logo{width:min(56vw,46vh,260px);height:auto}
.title{font-size:clamp(28px,7vmin,44px);font-weight:900;letter-spacing:2px;margin:0;color:var(--accent-d);text-shadow:0 3px 0 #fff}
.loginBox{display:flex;gap:8px;width:min(92vw,420px)}
.loginBox input{flex:1;min-width:0;height:52px;border-radius:16px;border:3px solid var(--line);padding:0 14px;font-size:20px;background:#fff}
.hint{color:var(--muted);font-size:14px;text-align:center}
.corner{position:absolute;right:10px;bottom:10px}

/* 選年級 */
#scrGrade{align-items:center;justify-content:center}
.gradeWrap{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vh,16px)}
.gradeMascot svg{width:clamp(64px,16vmin,110px);height:auto}
.gradeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(92vw,520px)}
.gradeGrid .btn{min-height:clamp(56px,11vh,88px);font-size:clamp(20px,5vmin,28px);padding:0 6px}

/* 主畫面 */
.mapWrap{flex:1;min-height:0;display:flex;align-items:stretch;gap:6px}
.zoneArrow{width:40px;flex:0 0 auto;border-radius:14px;background:rgba(255,255,255,.6);font-size:28px;font-weight:900}
.zoneArrow:disabled{opacity:.25}
.zone{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;padding:10px;gap:8px}
.zoneHead{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.zoneHead svg{width:clamp(44px,10vmin,70px);height:auto;flex:0 0 auto}
.zoneName{font-size:clamp(20px,5vmin,28px);font-weight:900}
.zoneTeach{color:var(--muted);font-size:14px}
.levels{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:8px}
.lv{border-radius:18px;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:0;position:relative}
.lv b{font-size:clamp(22px,6vmin,36px);line-height:1}
.lv .stars{display:flex;gap:1px}.lv .stars svg{width:clamp(14px,3.6vmin,22px);height:auto}
.lv.boss{background:linear-gradient(160deg,#efe6ff,#d3c3ff)}
.lv.lock{opacity:.5}
.lv .lk{width:26px;height:26px}
.lv .md{position:absolute;top:5px;right:6px;width:clamp(15px,3.8vmin,22px);height:clamp(15px,3.8vmin,22px);color:#b39a84}
.lv .md svg{width:100%;height:100%;display:block}
.lv .bossFace{width:clamp(34px,9vmin,54px)}
.soon{flex:1;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--muted);text-align:center}
.homeBtns{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.homeBtns .btn{font-size:15px;padding:0 4px;min-height:52px;flex-direction:column;gap:0;line-height:1.15}
.homeBtns .btn svg{width:22px;height:22px}
.closedMap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;font-weight:800;font-size:20px}

/* 遊戲 */
.playMain{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.stageCol{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.statusRow{display:flex;align-items:center;gap:8px;height:clamp(44px,9vh,64px)}
.mascot{height:100%;aspect-ratio:1;flex:0 0 auto}
.mascot svg{width:100%;height:100%}
.mascot.talk{animation:bob .3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px) scale(1.05)}}
.status{flex:1;font-size:clamp(20px,5.5vmin,32px);font-weight:900;white-space:nowrap;overflow:hidden;display:flex;align-items:center}
.status svg{width:1.05em;height:1.05em;margin-right:6px;color:var(--accent-d);flex:0 0 auto}
.status small{font-size:.55em;color:var(--muted);font-weight:700;margin-left:6px}
.cardsWrap{position:relative}
.cards{display:grid;gap:6px;grid-template-columns:repeat(4,1fr)}
.ncard{position:relative;background:#fff;border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 2px 4px;height:clamp(78px,17vh,140px);transition:transform .08s,background .08s;border:3px solid transparent}
.ncard svg.note{flex:1;min-height:0;width:100%}
.ncard .cnt{font-size:clamp(14px,3.6vmin,20px);font-weight:900;white-space:nowrap}
.ncard .cnt i{font-style:normal;opacity:.4}
.ncard .cnt .rest{opacity:.45}
.ncard .dots{display:flex;gap:4px;height:10px}
.ncard .dots span{width:10px;height:10px;border-radius:50%;background:#e8ddd0}
.ncard .dots span.P{background:var(--perfect)}.ncard .dots span.G{background:var(--good)}.ncard .dots span.M{background:var(--miss)}
.ncard.demo{background:#fff0c2;border-color:var(--accent);transform:translateY(-4px)}
.ncard.now{border-color:var(--blue);background:#e6f4ff}
.ncard.bar2{margin-left:6px}
.ncard .shhI{position:absolute;top:-12px;right:-8px;width:44%;max-width:46px;opacity:0;transform:scale(.5);transition:opacity .15s,transform .15s;pointer-events:none}
.ncard .shhI svg{width:100%;height:auto;display:block}
.ncard.shh{animation:shake .45s;border-color:var(--miss)}
.ncard.shh .shhI{opacity:1;transform:scale(1)}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.cards.look .ncard{animation:look .8s ease-in-out infinite alternate}
@keyframes look{to{border-color:#ffb36b;transform:translateY(-2px)}}
.ball{position:absolute;left:0;top:0;width:var(--bs,22px);height:var(--bs,22px);pointer-events:none;z-index:4;display:none;will-change:transform}
.ball.on{display:block}
.ball i{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 16%,#ff9a52 19%,#ff6a2b 72%);border:3px solid #fff;box-shadow:0 3px 6px rgba(0,0,0,.25);transform-origin:50% 100%}
.ball.rest i{background:radial-gradient(circle at 35% 30%,#fff 0 16%,#cdd6e4 19%,#93a3bb 72%)}
.ball.land i{animation:squash .16s ease-out}
@keyframes squash{0%{transform:scale(1.3,.7)}100%{transform:scale(1,1)}}
.pad{flex:1;min-height:120px;border-radius:28px;background:linear-gradient(160deg,#ffb36b,#ff7a3d);box-shadow:0 6px 0 #d45d1c,inset 0 -8px 0 rgba(0,0,0,.08);position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;touch-action:none}
.pad.idle{filter:saturate(.5) brightness(1.05)}
.pad.hit{transform:translateY(3px);box-shadow:0 3px 0 #d45d1c}
.pad.fever{animation:fever 1s ease-out}
@keyframes fever{0%{box-shadow:0 6px 0 #d45d1c,0 0 0 8px #ffe066,0 0 30px 10px rgba(255,224,102,.9)}100%{box-shadow:0 6px 0 #d45d1c,0 0 0 0 rgba(255,224,102,0)}}
.padInner{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;pointer-events:none;text-align:center}
.padIcon{color:#fff;height:clamp(34px,9vmin,60px)}
.padIcon svg{height:100%;width:auto}
.padIcon:empty{display:none}
#padText{font-size:clamp(26px,8vmin,56px);font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.15)}
#padSub{font-size:clamp(14px,3.5vmin,20px);font-weight:700;opacity:.9}
.judge{position:absolute;top:10%;left:0;right:0;text-align:center;font-weight:900;font-size:clamp(28px,8vmin,52px);color:#fff;pointer-events:none;opacity:0}
.judge.show{animation:pop .45s ease-out}
.judge.P{color:#e9ffef;text-shadow:0 3px 0 var(--perfect)}.judge.G{color:#fff7d6;text-shadow:0 3px 0 #c58f00}.judge.M{color:#ffe1e5;text-shadow:0 3px 0 #c42a3c}
.judge.R{color:#eef3ff;text-shadow:0 3px 0 #5b6f95}
@keyframes pop{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1) translateY(-12px)}}
.combo{position:absolute;top:8px;right:14px;color:#fff;text-align:center;font-weight:900;opacity:0;transition:opacity .2s;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.combo.on{opacity:1}
.combo b{display:block;font-size:clamp(26px,7vmin,46px);line-height:1}
.combo span{font-size:clamp(12px,3vmin,16px)}
.combo.gold b{color:#fff3a3}
.combo.pop b{animation:cpop .25s ease-out}
@keyframes cpop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.holdbar{position:absolute;left:10%;right:10%;bottom:12%;height:14px;border-radius:7px;background:rgba(255,255,255,.35);display:none}
.holdbar i{display:block;height:100%;width:0;border-radius:7px;background:#fff}
.holdbar.on{display:block}
.ring{position:absolute;width:40%;aspect-ratio:1;border-radius:50%;border:6px solid #fff;opacity:0;pointer-events:none}
.ring.go{animation:ring .5s ease-out}
@keyframes ring{0%{opacity:.8;transform:scale(.3)}100%{opacity:0;transform:scale(1.6)}}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.hearts{display:flex;gap:2px}.hearts svg{width:24px;height:24px}
.rdots{display:flex;gap:4px}.rdots span{width:12px;height:12px;border-radius:50%;background:rgba(0,0,0,.12)}.rdots span.on{background:var(--accent)}.rdots span.done{background:var(--perfect)}
.countBig{color:var(--blue-d)}
body.lowpower .mascot.talk,body.lowpower #bcast span,body.lowpower .cards.look .ncard{animation:none}
body.lowpower #bcast span{padding-left:8px}

/* 對照 */
.cmpWrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.cmpCard{flex:1;min-height:0;padding:6px;display:flex;flex-direction:column}
.cmpCard svg{flex:1;min-height:0;width:100%}
.cmpSum{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-weight:800}
.cmpSum .pill{font-size:14px;padding:3px 9px}
.cmpMsg{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:clamp(20px,5vmin,28px);text-align:center}
.cmIc{width:clamp(32px,8vmin,46px);height:clamp(32px,8vmin,46px);flex:0 0 auto;color:var(--accent-d)}
.cmIc svg{width:100%;height:100%;display:block}
.btnRow{flex:0 0 auto;display:flex;gap:10px;justify-content:center}
.btnRow .btn{flex:1;max-width:260px}
.btnRow.three{gap:8px}
.btnRow.three .btn{font-size:16px;padding:0 6px;gap:4px;min-width:0;white-space:nowrap}

/* 結果 */
.resWrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.4vh,14px);text-align:center}
.bigStars{display:flex;gap:10px}
.bigStars svg{width:clamp(48px,13vmin,90px);height:auto;opacity:.25;transform:scale(.6);transition:all .35s cubic-bezier(.3,1.6,.5,1)}
.bigStars svg.on{opacity:1;transform:scale(1)}
.resTitle{font-size:clamp(24px,7vmin,40px);font-weight:900}
.resAcc{font-size:clamp(16px,4vmin,22px);font-weight:800;color:var(--muted)}
.relay{width:min(94vw,640px);height:auto;max-height:20vh}
.coinGain{font-size:clamp(20px,5vmin,30px);font-weight:900;color:#c58f00}
.resExtra{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:800;min-height:0}
.resExtra .mini{width:clamp(26px,6vmin,36px);display:inline-block}
.resExtra .mini svg{width:100%;height:auto;display:block}

/* 練習 */
.prSlots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.prSlots .ncard{height:clamp(78px,16vh,130px)}
.prSlots .empty{border:3px dashed var(--line);background:rgba(255,255,255,.5);box-shadow:none}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.palette .ncard{height:clamp(70px,13vh,110px)}
.palette .ncard .nm{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg{display:flex;background:#fff;border-radius:14px;padding:3px;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.seg button{flex:1;padding:8px 10px;border-radius:11px;font-weight:800;white-space:nowrap}
.seg button.on{background:var(--blue);color:#fff}
.prTools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.prMain{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;justify-content:space-evenly}
.togBtn.on{background:#e6f4ff;box-shadow:0 4px 0 #9fd0f5;color:var(--blue-d)}

/* 商店／排行／設定／任務 */
.grid3{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:8px}
.shopItem{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;min-height:0;position:relative;border:3px solid transparent}
.shopItem.eq{border-color:var(--perfect)}
.shopItem svg{width:clamp(36px,10vmin,64px);height:auto}
.shopItem .nm{font-weight:900;font-size:clamp(15px,4vmin,20px)}
.shopItem .btn{min-height:34px;font-size:14px;padding:0 10px}
.shopItem .btn svg{width:18px;height:18px}
.list{flex:1;min-height:0;overflow:auto;padding:6px 10px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);font-weight:700}
.row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.me{background:#fff3d6;border-radius:10px}
.wall{padding:10px;display:flex;flex-direction:column;gap:6px}
.bar{height:16px;border-radius:8px;background:#efe5d8;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffcf4a,#ff8a3d);width:0;transition:width .6s}
.setList{flex:1;min-height:0;overflow:auto;padding:4px 10px}
.setRow{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);font-weight:700}
.setRow .grow{flex:1}
.setRow small{display:block;color:var(--muted);font-weight:500}
.tog{width:56px;height:32px;border-radius:16px;background:#ddd;position:relative;flex:0 0 auto;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tog.on{background:var(--perfect)}.tog.on::after{left:27px}
.misMain{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.misList{flex:0 0 auto;padding:6px 12px;display:flex;flex-direction:column}
.misHead,.bTitle{font-weight:900;font-size:16px;padding:4px 0}
.misRow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.misRow .grow{flex:1;min-width:0}
.misT{font-weight:800;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.misN{font-weight:800;color:var(--muted);min-width:42px;text-align:right}
.misRow .btn{min-height:36px;font-size:15px;padding:0 10px}
.misRow .btn svg{width:18px;height:18px}
.badgeBox{flex:1;min-height:0;padding:6px 12px;display:flex;flex-direction:column}
.badges{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:4px}
.bdg{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:2px}
.bdg svg{height:clamp(30px,7vh,60px);width:auto;max-width:100%;flex:0 1 auto;min-height:0}
.bdg .bn{font-size:12px;font-weight:700;color:#b5a99b;text-align:center;line-height:1.15}
.bdg.on .bn{color:var(--ink)}

/* 校正 */
.calMain{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.calInfo{flex:0 0 auto;text-align:center;font-weight:800;font-size:clamp(16px,4.2vmin,22px);padding:8px}
.beatDots{display:flex;gap:6px;justify-content:center}
.beatDots span{width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.12)}
.beatDots span.on{background:var(--blue)}.beatDots span.hit{background:var(--perfect)}

/* 老師面板 */
#teacher{position:fixed;inset:0;background:rgba(40,25,10,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:10px}
#teacher.on{display:flex}
.tbox{background:#fffaf2;border-radius:22px;width:min(100%,640px);height:min(100%,720px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.thead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}
.ttabs{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;background:#fff;border-bottom:1px solid var(--line)}
.ttabs button{padding:7px 9px;border-radius:10px;font-weight:800;white-space:nowrap;font-size:15px}
.ttabs button.on{background:var(--accent);color:#fff}
.tbody{flex:1;min-height:0;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text}
.tbody h3{margin:14px 0 6px;font-size:17px}
.tbody h3:first-child{margin-top:0}
.tf{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.tf label{min-width:96px;font-weight:700}
.tf input,.tf select{height:38px;border-radius:10px;border:2px solid var(--line);padding:0 8px;background:#fff;min-width:0}
.tf input[type=number]{width:90px}
.tmsg{min-height:20px;font-weight:700;color:var(--blue-d);white-space:pre-wrap}
.tmsg.err{color:var(--miss)}
.tnote{font-size:13px;color:var(--muted)}
.lvGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.lvGrid .tf{margin:0}.lvGrid label{min-width:36px}
.log{font-size:14px;line-height:1.6}
.pinBox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px}
.pinBox input{height:52px;width:180px;font-size:26px;text-align:center;border-radius:14px;border:3px solid var(--line);letter-spacing:6px}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 34px);transform:translateX(-50%);background:rgba(40,30,20,.9);color:#fff;padding:8px 16px;border-radius:14px;font-weight:700;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#toast.low{top:auto;bottom:calc(env(safe-area-inset-bottom) + 74px)}

@media (orientation:landscape){
  .playMain{flex-direction:row}
  .stageCol{flex:1.25;justify-content:center}
  .pad{flex:1}
  .ncard{height:clamp(70px,32vh,160px)}
  .cards.two .ncard{height:clamp(64px,26vh,130px)}
  .levels{grid-template-columns:repeat(6,1fr);grid-template-rows:1fr}
  .grid3{grid-template-columns:repeat(6,1fr);grid-template-rows:1fr}
  .prMain{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;align-content:center}
  .prMain .palette{grid-column:1/3}
  .gradeGrid{grid-template-columns:repeat(6,1fr);width:min(94vw,860px)}
  .misMain{display:grid;grid-template-columns:1fr 1.1fr}
  .misList{min-height:0}
}
@media (orientation:landscape) and (max-height:500px){
  .screen{padding:6px 10px;gap:6px}
  .topbar{min-height:36px}.iconbtn{width:36px;height:36px}
  .statusRow{height:44px}
  .btn{min-height:42px}
  .homeBtns .btn{min-height:44px;flex-direction:row;gap:4px}
  .logo{width:min(30vw,34vh)}
  .prSlots .ncard{height:clamp(60px,22vh,110px)}
  .palette .ncard{height:clamp(56px,20vh,90px)}
  .misRow{padding:4px 0}
  .bdg .bn{font-size:11px}
}
@media (orientation:portrait){
  .cards.two .ncard{height:clamp(66px,13vh,120px)}
}

function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  const g = Number(s.grade) || 3, readOk = String(S.cfg.readLevels) !== 'false' && !!(s.progress && s.progress['1-3']);
  const pool = MISSIONS.filter(m => !(m.hard && g <= 2) && !(m.key === 'read' && !readOk));
  let h = hashStr(s.name + '|' + today());
  const out = [], keys = {};
  while (out.length < 3 && pool.length) {
    const m = pool.splice(h % pool.length, 1)[0];
    h = (Math.imul(h ^ (h >>> 13), 2654435761) >>> 0) + 7;
    if (keys[m.key]) continue;
    keys[m.key] = 1; out.push(m.id);
  }

}
function daily() {
  const s = S.save;
  if (!s.daily || s.daily.date !== today()) s.daily = { date: today(), ids: pickMissions(s), prog: {}, claimed: [] };
  if (!s.daily.ids || !s.daily.ids.length) s.daily.ids = pickMissions(s);
  s.daily.prog = s.daily.prog || {}; s.daily.claimed = s.daily.claimed || [];
  return s.daily;
}
function dailyMissions() { return daily().ids.map(id => MISSIONS.find(m => m.id === id)).filter(Boolean); }

function buildRound(tokens, bpm, L) {
  const beat = 60 / bpm;

    const T = TOKENS[tok];
    spans.push({ tok, i, b0: b, b1: b + T.beats });
    if (tok === 'q') notes.push({ b, tok, ti: i, sub: 0 });

}

function scheduleRound(R) {
  const beat = R.beat, t0 = audio().currentTime + 0.3;

  for (let k = 0; k < 4; k++) {
    Sch.add(tC + k * beat, tt => SND.click(tt, k === 0), () => {
      setStatus('<span class="countBig">預備 ' + [1, 2, 3, 4].slice(0, k + 1).join('、') + '</span>');

  R.tE = tP + R.beats * beat + R.gw + 0.12;
  Sch.add(R.tE, null, () => finishRound());
  buildBallTrack(R);
  Sch.onFrame = hn => { drawBall(R, hn); updateRound(hn); };

// ---------- 跳動小球：示範時跟著節奏跳；看譜時只打拍子（不洩漏答案） ----------
function ballLayout(R) {
  const wr = $('#cardsWrap').getBoundingClientRect(), pts = [], rhythm = !!R.demo;
  R.spans.forEach(s => {
    const el = cardEl(s.i); if (!el) return;
    const r = el.getBoundingClientRect(), x0 = r.left - wr.left, w = r.width, y = r.top - wr.top, nb = TOKENS[s.tok].beats;
    if (!rhythm) { for (let k = 0; k < nb; k++) pts.push({ b: s.b0 + k, x: x0 + w * (k + 0.5) / nb, y, kind: 'n' }); return; }
    if (s.tok === 'e') { pts.push({ b: s.b0, x: x0 + w * 0.32, y, kind: 'n' }); pts.push({ b: s.b0 + 0.5, x: x0 + w * 0.68, y, kind: 'n' }); }

  for (let k = 0; k < 4; k++) L.push({ t: R.tC + k * R.beat, p: { x: f.x, y: f.y, kind: 'c' } });
  P.forEach(p => L.push({ t: R.tP + p.b * R.beat, p }));

  const a = L[i], b = L[i + 1];
  if (!b) return { x: a.p.x, y: a.p.y, k: 'end', landed: false };
  const dur = b.t - a.t;
  let x0 = a.p.x, ts = a.t, d = dur;
  if (a.p.kind === 'h') {   // 長音符：在卡片上滑過去
    const hold = Math.min(dur, a.p.hold * R.beat) * 0.82;
    if (t - a.t < hold) return { x: a.p.x + (a.p.x2 - a.p.x) * (t - a.t) / hold, y: a.p.y, k: 'h', landed };
    x0 = a.p.x2; ts = a.t + hold; d = dur - hold;
  }
  const s = clamp((t - ts) / d, 0, 1);
  const h = (a.p.kind === 'c' && b.p.kind === 'c') ? 12 : b.p.kind === 'end' ? 30 : clamp(d * 60, 14, 50);
  return { x: x0 + (b.p.x - x0) * s, y: a.p.y + (b.p.y - a.p.y) * s - 4 * h * s * (1 - s), k: a.p.kind, landed };

  el.classList.add('on');
  el.classList.toggle('rest', p.k === 'r');
  el.style.transform = `translate3d(${(p.x - R.ballSize / 2).toFixed(1)}px,${(p.y - R.ballSize * 0.92).toFixed(1)}px,0)`;
  if (p.landed) { el.classList.remove('land'); void el.offsetWidth; el.classList.add('land'); }

// ---------- 判定 ----------
function updateRound(hn) {

function drawRelay(ld, moved) {
  const ids = LEVEL_ORDER.filter(id => id[0] === String(ld.zone));
  const pos = ids.indexOf(ld.id), n = ids.length;
  const X = i => 50 + i * (540 / (n - 1)), Y = i => 92 - Math.sin(i / (n - 1) * Math.PI) * 26;
  let s = '<path d="' + ids.map((id, i) => (i ? 'L' : 'M') + X(i) + ' ' + Y(i)).join(' ') + '" fill="none" stroke="#c9a77e" stroke-width="4" stroke-dasharray="3 7" stroke-linecap="round"/>';
  ids.forEach((id, i) => {
    const done = (S.save.progress[id] || 0) > 0;
    s += `<g transform="translate(${X(i) - 27},${Y(i) - 36}) scale(.54)">${id.endsWith('B') ? bossInner(done ? 'sad' : '') : mascotInner(!done)}</g>`;
  });
  const from = pos, to = moved ? Math.min(n - 1, pos + 1) : pos;
  s += `<g id="relayMsg" style="transition:transform 1.2s ease-in-out" transform="translate(${X(from)},${Y(from) - 52})"><path d="M-16 -12 h32 a6 6 0 0 1 6 6 v12 a6 6 0 0 1 -6 6 h-18 l-8 8 v-8 h-6 a6 6 0 0 1 -6 -6 v-12 a6 6 0 0 1 6 -6z" fill="#fff" stroke="#ff8a3d" stroke-width="3"/><circle cx="-7" cy="0" r="3" fill="#ff8a3d"/><circle cx="2" cy="0" r="3" fill="#ff8a3d"/><circle cx="11" cy="0" r="3" fill="#ff8a3d"/></g>`;
  $('#relaySvg').innerHTML = s;
  if (moved && to !== from) setTimeout(() => { const m = $('#relayMsg'); if (m) m.setAttribute('transform', `translate(${X(to)},${Y(to) - 52})`); }, 700);

function openPractice() {

  show('scrPractice'); setZoneBg(1); renderPractice();
}
function practiceBeats() { return G.practiceTokens.reduce((a, t) => a + TOKENS[t].beats, 0); }
function renderPractice() {
  const el = $('#prSlots'); let b = 0, html = '';
  G.practiceTokens.forEach((t, i) => { html += `<div class="ncard" style="grid-column:span ${TOKENS[t].beats}" data-i="${i}">${noteSvg(t)}<div class="cnt">${countLabel(t, b)}</div></div>`; b += TOKENS[t].beats; });
  for (let k = b; k < 4; k++) html += '<div class="ncard empty"></div>';
  el.innerHTML = html;
  el.querySelectorAll('.ncard[data-i]').forEach(c => c.onclick = () => { G.practiceTokens.splice(Number(c.dataset.i), 1); renderPractice(); });
  $('#palette').innerHTML = Object.keys(TOKENS).map(t => `<button class="ncard" data-t="${t}">${noteSvg(t)}<div class="nm">${TOKENS[t].name}</div></button>`).join('');
  $('#palette').querySelectorAll('[data-t]').forEach(c => c.onclick = () => {
    const t = c.dataset.t; audio();
    const beat = 60 / (80 * G.practiceSpeed);
    if (t === 'e') { SND.drum(ctx.currentTime + 0.02); SND.drum(ctx.currentTime + 0.02 + beat / 2); }
    else if (t === 'h' || t === 'w') SND.hold(ctx.currentTime + 0.02, TOKENS[t].beats * beat * 0.95);
    else if (t === 'q') SND.drum(ctx.currentTime + 0.02);
    say(TOKENS[t].name);
    if (practiceBeats() + TOKENS[t].beats <= 4) { G.practiceTokens.push(t); renderPractice(); }
    else toast('一小節只能放 4 拍，點上面的卡片可以拿掉');
  });
  $('#prGo').disabled = practiceBeats() !== 4;
  $('#prDemoTog').textContent = G.practiceDemo ? '先示範：開' : '先示範：關';
  $('#prDemoTog').classList.toggle('on', G.practiceDemo);
}
function practiceDemo() {
  if (practiceBeats() !== 4) { toast('先放滿 4 拍'); return; }
  audio(); Sch.clear(); hush();
  const beat = 60 / (80 * G.practiceSpeed), t0 = ctx.currentTime + 0.2;
  const R = buildRound(G.practiceTokens, 80 * G.practiceSpeed, 1);
  R.notes.forEach(n => Sch.add(t0 + n.b * beat, n.hold ? (tt => SND.hold(tt, n.hold * beat * 0.95)) : (tt => SND.drum(tt)), null));
  R.spans.forEach(s => Sch.add(t0 + s.b0 * beat, null, () => $('#prSlots').querySelectorAll('.ncard[data-i]').forEach(c => c.classList.toggle('demo', Number(c.dataset.i) === s.i))));
  for (let k = 0; k < 4; k++) Sch.add(t0 + k * beat, tt => SND.click(tt, k === 0, true), null);
  Sch.add(t0 + 4 * beat, null, () => { $('#prSlots').querySelectorAll('.ncard').forEach(c => c.classList.remove('demo')); Sch.clear(); });
}
function practiceSay() {
  let b = 0; const w = [];
  G.practiceTokens.forEach(t => { w.push(speakWord(t, b)); b += TOKENS[t].beats; });
  say(w.join('，'));
}
function practiceRandom() {
  const pool = ['q', 'q', 'r', 'e', 'e', 'h'];
  const t = []; let b = 0;
  while (b < 4) { const k = pool[Math.floor(Math.random() * pool.length)]; if (b + TOKENS[k].beats <= 4) { t.push(k); b += TOKENS[k].beats; } }
  G.practiceTokens = t; renderPractice();
}
function practiceGo() {
  if (practiceBeats() !== 4) return;
  audio(); keepAwake();
  G.mode = 'practice'; G.level = null; G.combo = 0; G.maxCombo = 0; G.newBadges = [];
  G.intro = G.practiceIntro; G.practiceIntro = false;
  show('scrPlay'); runRound();
}

const CAL = { taps: [], clicks: [], running: false, after: null, prev: 'scrLogin' };
function openCalib(after) {
  audio(); CAL.after = after || null; CAL.running = false;
  if (curScreen !== 'scrCalib') CAL.prev = curScreen;
  show('scrCalib'); $('#calBack').innerHTML = ICON.back;
  $('#calText').innerHTML = '每台平板、喇叭的聲音都會慢一點點，先量一下！<br>聽到 4 下預備後，跟著「嘟」拍 8 下';
  $('#calDots').innerHTML = '<span></span>'.repeat(8);
  $('#calPadText').textContent = '準備'; $('#calStart').textContent = '開始測量'; $('#calStart').disabled = false;
}
function calibStart() {
  audio(); Sch.clear();
  CAL.taps = []; CAL.clicks = []; CAL.running = true; $('#calStart').disabled = true;
  const beat = 60 / 90, t0 = ctx.currentTime + 0.4;
  for (let k = 0; k < 12; k++) {
    const t = t0 + k * beat; if (k >= 4) CAL.clicks.push(t);
    Sch.add(t, tt => SND.click(tt, k < 4 ? k === 0 : true), () => {
      $('#calPadText').textContent = k < 4 ? '預備 ' + (k + 1) : '拍！';
      if (k >= 4) $('#calDots').querySelectorAll('span')[k - 4].classList.add('on');
    });
  }
  Sch.add(t0 + 12 * beat + 0.3, null, calibDone);
}
function calibTap(pt) {
  if (!ctx) return;
  tapSound(ctx.currentTime); $('#calPad').classList.add('hit'); ringFx('#calRing');
  if (!CAL.running) return;
  const t = heardNow(pt), beat = 60 / 90;
  let best = null, bd = 1e9;
  CAL.clicks.forEach((c, i) => { const d = Math.abs(t - c); if (d < bd && d < beat / 2) { bd = d; best = i; } });
  if (best !== null) { CAL.taps.push(t - CAL.clicks[best]); const d = $('#calDots').querySelectorAll('span')[best]; if (d) d.classList.add('hit'); }
}
function calibDone() {
  CAL.running = false; Sch.clear(); $('#calStart').disabled = false; $('#calStart').textContent = '重新測量';
  if (CAL.taps.length < 5) { $('#calText').innerHTML = '拍到的次數太少，再試一次吧！'; $('#calPadText').textContent = '再試一次'; return; }
  const a = CAL.taps.slice().sort((x, y) => x - y), med = a[Math.floor(a.length / 2)];
  S.lat = clamp(Math.round(med * 1000), -80, 400); LS.set('echo_lat', S.lat); updateTeacherDot();
  $('#calText').innerHTML = `完成！這台平板的延遲是 <b>${S.lat} ms</b><br>之後判定會自動扣掉`;
  $('#calPadText').textContent = '完成！';
}
function calibLeave() {
  Sch.clear(); CAL.running = false;
  const a = CAL.after; CAL.after = null;
  show(CAL.prev || 'scrLogin');
  if (CAL.prev === 'scrHome') renderHome();
  if (a) a();
}

      <div class="tf"><label>看譜關卡</label><select id="cRead">${opt('true', '開（第 4、5 關先看譜）', c.readLevels || 'true')}${opt('false', '關（每關都先示範）', c.readLevels)}</select></div>
      <div class="tf"><label>語音提示</label><select id="cVoice">${opt('true', '開', c.voice || 'true')}${opt('false', '關（全班同時玩太吵時）', c.voice)}</select></div>
      <div class="tf"><label>速度倍率</label><select id="cSpeed">${['0.6', '0.8', '1', '1.2', '1.4'].map(v => opt(v, v + ' 倍', c.speedMult || '1')).join('')}</select></div>
      <div class="tf"><label>判定寬鬆度</label><select id="cLen">${opt('1.4', '寬鬆', c.leniency || '1')}${opt('1', '標準', c.leniency || '1')}${opt('0.75', '嚴格', c.leniency || '1')}</select></div>
      <div class="tnote">速度和寬鬆度會再依年級自動調整（一年級最慢最寬鬆，六年級最快最嚴格）。</div>
      <div class="tf"><label>成就牆目標</label><input id="cGoal" type="number" min="10" value="${esc(c.classGoal || 500)}"><span class="tnote">全班累積 Perfect 數</span></div>
      <div class="tf"><button class="btn small" id="cSave">儲存並同步到全班</button></div><div class="tmsg" id="cMsg"></div>
      <h3>廣播給全班</h3>
      <div class="tf"><input id="bText" maxlength="80" style="flex:1" placeholder="例如：今天挑戰操場第 3 關！"></div>
      <div class="tf"><label>顯示</label><select id="bMin">${opt('10', '10 分鐘', 30)}${opt('30', '30 分鐘', 30)}${opt('120', '2 小時', 30)}${opt('1440', '1 天', 30)}</select><button class="btn small blue" id="bSend">送出廣播</button></div>
      <div class="tmsg" id="bMsg"></div>
      <div class="tnote">設定存在試算表「設定」分頁；小朋友的平板大約 1～2 分鐘內會自動更新（在地圖畫面時）。</div>`;
    $('#cSave').onclick = async () => {
      const conf = { mapClosed: $('#cMap').value, shopLocked: $('#cShop').value, maxLevel: $('#cMax').value, readLevels: $('#cRead').value, voice: $('#cVoice').value,
        speedMult: $('#cSpeed').value, leniency: $('#cLen').value, classGoal: $('#cGoal').value };
      Object.assign(S.cfg, conf); LS.set('echo_cfg', S.cfg);
      if (!sheetUrl()) { tmsg('#cMsg', '已套用在這台平板（還沒連試算表，其他平板不會同步）'); return; }
      tmsg('#cMsg', '同步中…');
      try { const r = await api('POST', { action: 'setConfig', pin: S.pin, config: conf }); tmsg('#cMsg', r.ok ? '✅ 已同步到試算表' : '❌ ' + r.error, !r.ok); }
      catch (e) { tmsg('#cMsg', '❌ 連不上：' + e.message, true); }
    };
    $('#bSend').onclick = async () => {
      const text = $('#bText').value.trim(); if (!text) return;
      tmsg('#bMsg', '送出中…');
      try { const r = await api('POST', { action: 'broadcast', pin: S.pin, text, minutes: Number($('#bMin').value) }); tmsg('#bMsg', r.ok ? '✅ 已送出' : '❌ ' + r.error, !r.ok); if (r.ok) { $('#bText').value = ''; refreshRemote(); } }
      catch (e) { tmsg('#bMsg', '❌ 連不上：' + e.message, true); }
    };
  }
  if (tTab === 'mod') {
    const inp = (cat, item, def, w) => { const v = modVal(cat, item); return `<input type="number" data-cat="${cat}" data-item="${item}" value="${esc(v !== null && v !== '' ? v : def)}" style="width:${w || 80}px">`; };
    B.innerHTML = `<h3>改小朋友的資料</h3>
      <div class="tf"><label>姓名</label><input id="mName" placeholder="小朋友的名字" style="flex:1"></div>
      <div class="tf"><label>年級</label><select id="mGrade"><option value="">不改</option>${[1, 2, 3, 4, 5, 6].map(g => `<option value="${g}">${ZH[g]}年級</option>`).join('')}</select></div>
      <div class="tf"><label>金幣改成</label><input id="mCoins" type="number" placeholder="不改就空白"></div>
      <div class="tf"><label>進度</label><select id="mProg"><option value="">不改</option>${LEVEL_ORDER.map(id => `<option value="${id}">開放到 ${levelName(id)}</option>`).join('')}<option value="reset">清除全部進度</option></select></div>
      <div class="tf"><button class="btn small" id="mApply">套用</button></div><div class="tmsg" id="mMsg"></div>
      <h3>獎勵數值</h3>
      ${Object.keys(REWARD_DEFAULT).map(k => `<div class="tf"><label>${k}</label>${inp('獎勵', k, REWARD_DEFAULT[k])}</div>`).join('')}
      <h3>商店價格</h3>
      <div class="lvGrid">${SHOP.map(s => `<div class="tf"><label>${s.name}</label>${inp('商店價格', s.id, s.price, 70)}</div>`).join('')}</div>
      <h3>每關速度（每分鐘幾拍，會再依年級調整）</h3>
      <div class="lvGrid">${LEVEL_ORDER.map(id => `<div class="tf"><label>${id.replace('B', '王')}</label>${inp('關卡速度', id, LEVELS_DEFAULT[id][0], 64)}</div>`).join('')}</div>
      <div class="tf" style="margin-top:10px"><button class="btn small" id="mSave">儲存數值</button></div><div class="tmsg" id="mSaveMsg"></div>
      <div class="tnote">每關的節奏可以在試算表「修改器」分頁的「關卡節奏」改：q＝四分音符、r＝四分休止符、e＝八分音符（兩個一組）、h＝二分音符、w＝全音符，用 | 分隔每一題，每題要剛好 4 拍（大魔王 8 拍）。<br>也可以直接在「修改器」分頁新增「玩家金幣」「玩家進度」列。</div>`;
    $('#mApply').onclick = async () => {
      const name = $('#mName').value.trim(); if (!name) { tmsg('#mMsg', '請輸入姓名', true); return; }
      const prog = $('#mProg').value, body = { action: 'setPlayer', pin: S.pin, name };
      if ($('#mCoins').value !== '') body.coins = Number($('#mCoins').value);
      if ($('#mGrade').value) body.grade = Number($('#mGrade').value);
      if (prog === 'reset') body.resetProgress = true; else if (prog) body.levels = LEVEL_ORDER.slice(0, LEVEL_ORDER.indexOf(prog) + 1);
      if (S.save && S.save.name === name && (S.test || !sheetUrl())) {
        if (body.coins !== undefined) S.save.coins = body.coins;
        if (body.grade) S.save.grade = body.grade;
        if (body.resetProgress) S.save.progress = {};
        if (body.levels) body.levels.forEach(id => { if (!S.save.progress[id]) S.save.progress[id] = 1; });
        persist(); tmsg('#mMsg', '✅ 已改這台平板上的資料'); return;
      }
      tmsg('#mMsg', '套用中…');
      try {
        const r = await api('POST', body);
        if (r.ok) {
          tmsg('#mMsg', `✅ 已更新 ${name}：金幣 ${r.save.coins}${r.save.grade ? '、' + ZH[r.save.grade] + '年級' : ''}`);
          if (S.save && S.save.name === name) { const m = absorb(r.save, S.save); S.save = m; writeLocal(m); setDirty(name, sigOf(m) !== sigOf(r.save)); updateHomeTop(); }
        } else tmsg('#mMsg', '❌ ' + r.error, true);
      } catch (e) { tmsg('#mMsg', '❌ 連不上：' + e.message, true); }
    };
    $('#mSave').onclick = async () => {
      const rows = [];
      B.querySelectorAll('input[data-cat]').forEach(i => { if (i.value !== '') rows.push({ cat: i.dataset.cat, item: i.dataset.item, value: i.value }); });
      rows.forEach(r => { const m = S.mods.find(x => x.cat === r.cat && x.item === r.item); if (m) m.value = r.value; else S.mods.push(r); });
      LS.set('echo_mods', S.mods);
      if (!sheetUrl()) { tmsg('#mSaveMsg', '已套用在這台平板（還沒連試算表）'); return; }
      tmsg('#mSaveMsg', '同步中…');
      try { const r = await api('POST', { action: 'setMods', pin: S.pin, rows }); tmsg('#mSaveMsg', r.ok ? '✅ 已同步到試算表「修改器」' : '❌ ' + r.error, !r.ok); }
      catch (e) { tmsg('#mSaveMsg', '❌ 連不上：' + e.message, true); }
    };
  }
  if (tTab === 'dev') {
    B.innerHTML = `<h3>延遲校正</h3>
      <div class="tnote" style="font-size:15px;color:${S.lat === null ? 'var(--miss)' : 'var(--ink)'};font-weight:700">${S.lat === null ? '⚠️ 這台平板還沒校正，判定可能不準' : '這台平板的延遲：' + S.lat + ' ms'}</div>
      <div class="tnote">每台平板、喇叭的聲音延遲不一樣；換了藍牙喇叭或耳機要重新校正。只要校正一次，小朋友不會看到這個步驟。登入畫面的「老師」按鈕有紅點，就代表這台還沒校正。</div>
      <div class="tf"><button class="btn small" id="dCal">開始校正</button><button class="btn small white" id="dSnd">${ICON.speaker}測試聲音</button></div>
      <h3>版本</h3>
      <div class="tf"><span>這台平板：第 ${APP_VERSION} 版</span><button class="btn small white" id="dVer">檢查新版本</button></div>
      <div class="tnote">有新版本時，畫面最上面會出現綠色橫條，小朋友點一下就會更新。</div>`;
    $('#dCal').onclick = () => { closeTeacher(); openCalib(() => openTeacher()); };
    $('#dSnd').onclick = testSound;
    $('#dVer').onclick = () => checkUpdate(true);
  }
  if (tTab === 'other') {
    B.innerHTML = `<h3>測試模式</h3>
      <div class="setRow" style="padding:6px 0"><div class="grow">全部關卡解鎖、成績不寫入試算表<small>只影響這台平板；切換後要重新登入（測試用的存檔和正式的分開）</small></div><button class="tog ${S.test ? 'on' : ''}" id="oTest"></button></div>
      <h3>更改老師密碼</h3>
      <div class="tf"><label>舊密碼</label><input id="oOld" type="password" inputmode="numeric"></div>
      <div class="tf"><label>新密碼</label><input id="oNew" type="password" inputmode="numeric"></div>
      <div class="tf"><button class="btn small" id="oPin">更改</button></div><div class="tmsg" id="oMsg"></div>
      <h3>更新日誌（目前第 ${APP_VERSION} 版）</h3>
      <div class="log">${CHANGELOG.map(c => `<b>第 ${c.v} 版</b>（${c.date}）<br>${c.add.map(a => '🆕 新增：' + esc(a)).join('<br>')}${c.fix.length ? '<br>' + c.fix.map(a => '🔧 修復：' + esc(a)).join('<br>') : ''}`).join('<br><br>')}</div>
      <h3>試算表分頁說明</h3>
      <div class="tnote">Users（每人一列存檔與統計）、成績、排行榜、錯誤統計、學習報告（最常拍錯、快慢、7 天進步、休止符多拍、建議練習）、設定、修改器、修改紀錄、廣播。</div>
      <div class="tf" style="margin-top:12px"><button class="btn small white" id="oLock">登出老師面板</button></div>`;
    $('#oTest').onclick = () => {
      S.test = !S.test; LS.set('echo_test', S.test);
      closeTeacher(); logout();
      toast(S.test ? '已切換到測試模式，請重新登入' : '已切換回正式模式，請重新登入', 3500);
    };
    $('#oLock').onclick = () => { S.pin = null; closeTeacher(); };
    $('#oPin').onclick = async () => {
      const o = $('#oOld').value.trim(), n = $('#oNew').value.trim();
      if (!n) { tmsg('#oMsg', '新密碼不能空白', true); return; }
      if (sheetUrl()) {
        try { const r = await api('POST', { action: 'setPin', oldPin: o, newPin: n }); if (!r.ok) { tmsg('#oMsg', '❌ ' + r.error, true); return; } }
        catch (e) { tmsg('#oMsg', '❌ 連不上試算表，密碼沒有改', true); return; }
      } else if (o !== String(LS.get('echo_pin', '1234'))) { tmsg('#oMsg', '舊密碼錯誤', true); return; }
      LS.set('echo_pin', n); S.pin = n; tmsg('#oMsg', '✅ 密碼已更改' + (sheetUrl() ? '（試算表也同步了）' : ''));
    };
  }
}

// ====================== 事件綁定 ======================
function bindPad(el) {
  const active = new Set();
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); active.add(e.pointerId);
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    press(evTime(e));
  });
  const up = e => { if (!active.has(e.pointerId)) return; active.delete(e.pointerId); if (!active.size) release(evTime(e)); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
bindPad($('#pad')); bindPad($('#calPad'));
let spaceDown = false;
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.key !== ' ') return;
  if (curScreen !== 'scrPlay' && curScreen !== 'scrCalib') return;
  if (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  e.preventDefault();
  if (e.repeat || spaceDown) return;
  spaceDown = true; press(evTime(e));
});
document.addEventListener('keyup', e => {
  if (e.code !== 'Space' && e.key !== ' ') return;
  if (!spaceDown) return; spaceDown = false; release(evTime(e));
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    flush();
    if (curScreen === 'scrPlay' && G.R && G.R.phase !== 'done') { stopGame(); hush(); G.mode === 'practice' ? openPractice() : goHome(); }
  } else {
    if (S.save) keepAwake();
    if (Date.now() - lastCheck > 600000) checkUpdate(false);
  }
});
window.addEventListener('resize', () => { if (curScreen === 'scrPlay' && G.R) { renderCards(G.R, $('#cards')); ballLayout(G.R); } });

$('#btnLogin').onclick = login;
$('#nameInput').onkeydown = e => { if (e.key === 'Enter') login(); };
$('#btnTeacher1').onclick = openTeacher;
$('#tClose').onclick = closeTeacher;
$('#updBar').onclick = doUpdate;
$('#btnPractice').onclick = openPractice;
$('#btnMission').onclick = openMissions;
$('#btnShop').onclick = openShop;
$('#btnBoard').onclick = openBoard;
$('#btnSettings').onclick = openSettings;
$('#playBack').onclick = () => { stopGame(); hush(); G.mode === 'practice' ? openPractice() : goHome(); };
$('#cmpRetry').onclick = () => {
  Sch.clear(); hush();
  if (G.mode === 'adv' && G.att.fails >= 2) {   // 卡關協助：錯兩次就放慢、看譜關卡先示範
    const msgs = [];
    if (G.lvMode === 'read' && G.att.fails === 2) msgs.push('我先示範一次給你聽');
    if (G.assist > 0.8 + 1e-6) { G.assist = Math.round((G.assist - 0.1) * 10) / 10; msgs.push('放慢一點點'); }
    if (msgs.length) { G.pendingSay = msgs.join('，') + '，再試一次！'; toast(G.pendingSay, 3000); }
  }
  show('scrPlay'); runRound();
};
$('#cmpPlay').onclick = playCompare;
$('#cmpNext').onclick = () => {
  Sch.clear(); hush();
  if (G.mode === 'practice') { openPractice(); return; }
  if (isLastQ()) { finishLevel(); return; }
  G.ri++; newQuestion(); show('scrPlay'); runRound();
};
$('#resMap').onclick = goHome;
$('#prBack').onclick = () => { Sch.clear(); goHome(); };
$('#prBack').innerHTML = ICON.back;
$('#prDemo').onclick = practiceDemo;
$('#prSay').onclick = practiceSay;
$('#prRand').onclick = practiceRandom;
$('#prClear').onclick = () => { G.practiceTokens = []; renderPractice(); };
$('#prDemoTog').onclick = () => { G.practiceDemo = !G.practiceDemo; renderPractice(); };
$('#prGo').onclick = practiceGo;
$('#prSpeed').querySelectorAll('button').forEach(b => b.onclick = () => {
  G.practiceSpeed = Number(b.dataset.v); $('#prSpeed').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
});
$('#misBack').onclick = goHome; $('#shopBack').onclick = goHome; $('#boardBack').onclick = goHome; $('#setBack').onclick = goHome;
$('#calBack').onclick = calibLeave; $('#calSkip').onclick = calibLeave; $('#calStart').onclick = calibStart;
document.addEventListener('gesturestart', e => e.preventDefault());

// 給自動測試用
window.__echo = { G, S, CAL, persist, goHome, press, release, heardNow: p => heardNow(p), latSec, flush, checkUpdate, pending: () => ({ dirty: getDirty(), recs: getRecs() }), say };

// 初始化
$('#logoSvg').innerHTML = logoSvg();
$('#nameInput').value = LS.get('echo_last', '');
bindZoneArrows();
applyLow();
updateTeacherDot();
refreshRemote();
schedulePoll();
setTimeout(() => checkUpdate(false), 8000);
setInterval(() => { if (!document.hidden) checkUpdate(false); }, 600000);
</script>
